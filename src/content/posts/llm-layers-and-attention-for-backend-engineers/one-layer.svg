<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">One layer has two moves: attention, then feed-forward</title>
<desc id="d">Four panels left to right. A grid of six rows goes in. Move 1, attention: rows read from other rows, shown as arrows between rows. Move 2, feed-forward: each row is processed on its own, shown as a loop on each row. A grid of six rows with the same shape comes out.</desc>
<style>
.bg{fill:#fcfcfb} .t1{fill:#0b0b0b;font:600 16px system-ui,sans-serif} .t2{fill:#52514e;font:13px system-ui,sans-serif}
.lab{fill:#0b0b0b;font:600 14px system-ui,sans-serif} .tok{fill:#fff;stroke:#b8b7b0;stroke-width:1.5} .mono{font:600 15px ui-monospace,Menlo,monospace}
.pct{font:600 15px system-ui,sans-serif;text-anchor:middle} .row{fill:#e9e8e3;stroke:#b8b7b0} .rowb{fill:#cfe0f7;stroke:#2a78d6}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
</defs>
<rect class="bg" width="760" height="350"/>
<text class="t1" x="30" y="32">One layer = two moves, and the grid keeps the same shape</text>
<text class="t2" x="30" y="52">A real model stacks 32 or more layers like this, each one feeding the next.</text>
<rect class="row" x="30" y="100" width="110" height="22" rx="4"/><text class="t2" x="38" y="116" style="font-size:11px">row 1</text><rect class="row" x="30" y="130" width="110" height="22" rx="4"/><text class="t2" x="38" y="146" style="font-size:11px">row 2</text><rect class="row" x="30" y="160" width="110" height="22" rx="4"/><text class="t2" x="38" y="176" style="font-size:11px">row 3</text><rect class="row" x="30" y="190" width="110" height="22" rx="4"/><text class="t2" x="38" y="206" style="font-size:11px">row 4</text><rect class="row" x="30" y="220" width="110" height="22" rx="4"/><text class="t2" x="38" y="236" style="font-size:11px">row 5</text><rect class="row" x="30" y="250" width="110" height="22" rx="4"/><text class="t2" x="38" y="266" style="font-size:11px">row 6</text><text class="lab" x="30" y="86">Grid in</text><text class="t2" x="30" y="296">[N, d_model]</text>
<rect class="row" x="215" y="100" width="110" height="22" rx="4"/><text class="t2" x="223" y="116" style="font-size:11px">row 1</text><rect class="row" x="215" y="130" width="110" height="22" rx="4"/><text class="t2" x="223" y="146" style="font-size:11px">row 2</text><rect class="row" x="215" y="160" width="110" height="22" rx="4"/><text class="t2" x="223" y="176" style="font-size:11px">row 3</text><rect class="row" x="215" y="190" width="110" height="22" rx="4"/><text class="t2" x="223" y="206" style="font-size:11px">row 4</text><rect class="row" x="215" y="220" width="110" height="22" rx="4"/><text class="t2" x="223" y="236" style="font-size:11px">row 5</text><rect class="row" x="215" y="250" width="110" height="22" rx="4"/><text class="t2" x="223" y="266" style="font-size:11px">row 6</text><path d="M 325 261 C 363 261 363 141 325 141" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/><path d="M 325 261 C 363 261 363 201 325 201" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/><path d="M 325 201 C 363 201 363 141 325 141" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/><path d="M 325 231 C 363 231 363 201 325 201" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/><path d="M 325 171 C 363 171 363 111 325 111" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/><text class="lab" x="215" y="86">Move 1: attention</text><text class="t2" x="215" y="296">rows read from other rows</text>
<rect class="row" x="400" y="100" width="110" height="22" rx="4"/><text class="t2" x="408" y="116" style="font-size:11px">row 1</text><rect class="row" x="400" y="130" width="110" height="22" rx="4"/><text class="t2" x="408" y="146" style="font-size:11px">row 2</text><rect class="row" x="400" y="160" width="110" height="22" rx="4"/><text class="t2" x="408" y="176" style="font-size:11px">row 3</text><rect class="row" x="400" y="190" width="110" height="22" rx="4"/><text class="t2" x="408" y="206" style="font-size:11px">row 4</text><rect class="row" x="400" y="220" width="110" height="22" rx="4"/><text class="t2" x="408" y="236" style="font-size:11px">row 5</text><rect class="row" x="400" y="250" width="110" height="22" rx="4"/><text class="t2" x="408" y="266" style="font-size:11px">row 6</text><line x1="510" y1="111" x2="526" y2="111" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="101" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="116" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><line x1="510" y1="141" x2="526" y2="141" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="131" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="146" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><line x1="510" y1="171" x2="526" y2="171" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="161" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="176" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><line x1="510" y1="201" x2="526" y2="201" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="191" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="206" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><line x1="510" y1="231" x2="526" y2="231" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="221" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="236" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><line x1="510" y1="261" x2="526" y2="261" stroke="#1baf7a" stroke-width="2"/><rect x="526" y="251" width="30" height="20" rx="5" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="541" y="266" text-anchor="middle" style="font:italic 600 13px ui-monospace,Menlo,monospace" fill="#1baf7a">f</text><text class="lab" x="400" y="86">Move 2: feed-forward</text><text class="t2" x="400" y="296">each row thinks on its own</text>
<rect class="rowb" x="600" y="100" width="110" height="22" rx="4"/><text class="t2" x="608" y="116" style="font-size:11px">row 1</text><rect class="rowb" x="600" y="130" width="110" height="22" rx="4"/><text class="t2" x="608" y="146" style="font-size:11px">row 2</text><rect class="rowb" x="600" y="160" width="110" height="22" rx="4"/><text class="t2" x="608" y="176" style="font-size:11px">row 3</text><rect class="rowb" x="600" y="190" width="110" height="22" rx="4"/><text class="t2" x="608" y="206" style="font-size:11px">row 4</text><rect class="rowb" x="600" y="220" width="110" height="22" rx="4"/><text class="t2" x="608" y="236" style="font-size:11px">row 5</text><rect class="rowb" x="600" y="250" width="110" height="22" rx="4"/><text class="t2" x="608" y="266" style="font-size:11px">row 6</text><text class="lab" x="600" y="86">Grid out</text><text class="t2" x="600" y="296">[N, d_model] again</text>
<line x1="148" y1="185" x2="207" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#ak)"/><line x1="375" y1="185" x2="392" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#ak)"/><line x1="558" y1="185" x2="592" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#ak)"/><text class="t2" x="30" y="334">Attention is the only move where rows talk to each other. In both moves, N rows go in and N rows come out.</text>
</svg>
